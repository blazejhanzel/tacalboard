<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>
      const theme = localStorage.getItem('settings')
        ? JSON.parse(localStorage.getItem('settings')).theme
        : 'light'

      document.documentElement.setAttribute('data-bs-theme', theme)
      document.documentElement.setAttribute('data-custom-theme', theme)
    </script>
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no viewport-fit=cover">
    <meta name="theme-color" content="#fafafb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tacalboard</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
